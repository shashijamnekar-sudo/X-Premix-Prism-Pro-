<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X Premix Prism Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root{--g:#d4af37;--n:#050d1a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(12px,1.5vw,30px);height:100%}
body{height:100%;margin:0;background:#000;color:#fff;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;overflow:hidden;user-select:none}
#app{height:100%;display:flex;flex-direction:column;background:var(--n)}
.au{background:linear-gradient(95deg,#8a6a1c,#f6dc8a 35%,#c9962b 60%,#f9e9a8);-webkit-background-clip:text;background-clip:text;color:transparent}
.gx{font-family:Comfortaa,"Trebuchet MS",sans-serif;font-weight:400;font-size:1.7rem;line-height:1;white-space:nowrap}
.gx sup{font-size:1rem}
.mk{display:flex;align-items:center;gap:.5rem}
.mk b{display:block;font-family:Comfortaa,sans-serif;font-size:1.5rem;letter-spacing:.12em;line-height:1}
.mk small{display:block;font-size:.5rem;letter-spacing:.35em;margin-top:.15rem}
.wh{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1.6rem}
.hm{flex:1;position:relative;overflow:auto;background:radial-gradient(ellipse at 50% 100%,#0e3350,transparent 65%);display:flex;flex-direction:column}
.cols{display:grid;grid-template-columns:repeat(2,1fr);max-width:44rem;width:100%;margin:2.6rem auto 0;padding:0 1.5rem}
.cols section{display:flex;flex-direction:column;gap:.8rem;align-items:center;padding:0 1rem;border-left:1px solid #17506a}
.cols section:first-child{border:0}
.cols h3{margin:0 0 .6rem;font-weight:300;letter-spacing:.15em;font-size:1.1rem}
.gb{width:100%;max-width:14rem;border:1.5px solid var(--g);background:rgba(0,0,0,.4);color:#fff;border-radius:3px;padding:.85rem .4rem;font:600 .95rem inherit;font-family:inherit;cursor:pointer;transition:.15s}
.gb:hover,.gb:active{background:#d4af3733;box-shadow:0 0 12px #d4af3777}
.art{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:min(36rem,60%);pointer-events:none}
.ft{position:absolute;bottom:.9rem;left:1.4rem;right:1.4rem;display:flex;justify-content:space-between}
.ft button{background:none;border:0;color:#fff;font:600 .8rem inherit;font-family:inherit;cursor:pointer;padding:.4rem}
.top{display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.4rem;background:#000}
.top button{background:none;border:0;color:#fff;font:600 1rem inherit;font-family:inherit;cursor:pointer}
.top h2{margin:0;font-size:1rem;letter-spacing:.08em}
.top .gx{font-size:1.35rem}
.pn{flex:1;background:#fff;margin:0;color:#222;display:flex;flex-direction:column;min-height:0}
.tt{display:flex;margin:.6rem .6rem 0}
.tt button{flex:1;background:#fff;border:0;border-bottom:1px solid var(--g);font:700 1rem inherit;font-family:inherit;padding:.9rem .3rem;cursor:pointer;color:#222}
.tt button.on{border:1px solid var(--g);border-bottom-color:#fff}
.bd{flex:1;display:flex;gap:.8rem;padding:0 .6rem .6rem;min-height:0}
.st{flex:1;border:1px solid var(--g);padding:.9rem;position:relative;min-height:0;display:flex;border-top:0}
.sc{position:relative;flex:1;overflow:hidden;min-height:0}
.sc img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.tkw{height:4.1rem;padding:.15rem .8rem;overflow-x:auto}.tk{height:3.8rem;overflow:hidden;animation:in .4s both}.tk img{height:3.8rem;display:block;max-width:none}
.sd{width:12rem;display:flex;flex-direction:column;gap:.6rem;flex:none;overflow:auto;padding-top:.6rem}
.sd button{border:1px solid #c9b79a;box-shadow:0 2px 0 #d6c39a;background:#fff;color:#222;padding:.85rem .4rem;font:600 .95rem inherit;font-family:inherit;cursor:pointer;border-radius:3px}
.sd button.on{background:linear-gradient(#e2c15a,#b08a24);color:#fff;border-color:#b08a24}
.sd p{font-size:.8rem;margin:.3rem 0 0;color:#444;line-height:1.4}
.cap{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.85);color:#222;text-align:center;font-weight:600;font-size:.8rem;padding:.6rem;text-transform:uppercase;letter-spacing:.03em}
.ttl{position:absolute;left:.9rem;top:.7rem;font-size:1.6rem;font-weight:700;color:#fff;text-shadow:0 1px 5px #0007;z-index:2}
.tech{display:flex;gap:.8rem;padding:.3rem .8rem;min-height:3.6rem;color:#333;align-items:flex-start;overflow-x:auto}
.tech div{width:3.8rem;text-align:center;font-size:.42rem;font-weight:700;line-height:1.2;flex:none;animation:in .3s both}
.tech b{display:block;font-size:1.3rem;font-weight:400;color:#555;line-height:1.3}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.nav{display:flex;justify-content:center;gap:2.5rem;padding:.8rem .6rem 1rem;background:#000}
.nav button{background:none;border:0;color:var(--g);font:600 .95rem inherit;font-family:inherit;cursor:pointer;padding:.3rem .5rem}
.nav button.on{color:#fff}
.md{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9}
.md div{background:#0d1d33;border:2px solid var(--g);border-radius:6px;padding:1.5rem;max-width:30rem;width:88%}
.md h3{margin:0 0 .6rem;font-size:1.2rem}.md p{margin:0 0 1rem;line-height:1.5;font-size:.95rem}
.md button{background:linear-gradient(#e2c15a,#b08a24);border:0;padding:.6rem 1.4rem;font-weight:700;border-radius:3px;cursor:pointer}
@media(max-width:640px){.cols{grid-template-columns:1fr;gap:1.5rem}.cols section{border:0}.sd{width:8rem}.bd{flex-wrap:wrap}}
</style></head>

function home(){return '<div class="hm"><div class="wh">'+GX+MK+'</div><div class="cols"><section><h3 class="au">MATERIAL</h3><button class="gb" data-go="blu">Blumax</button></section><section><h3 class="au">DESIGN</h3><button class="gb" data-go="bif">Bifocal</button></section></div><svg class="art" viewBox="0 0 560 200"><defs><radialGradient id="lg"><stop offset="0" stop-color="#e6c870"/><stop offset="1" stop-color="#5a4410"/></radialGradient></defs><g stroke="#d4af37" opacity=".55"><path d="M170 190L260 70 300 190 340 70 420 190M200 120h180M230 90l120 100"/></g><path d="M60 150q10-80 150-90 60 0 70 30 0 70-190 90-30 0-30-30z" fill="url(#lg)" stroke="#fff3c4" stroke-width="3" opacity=".75"/><path d="M500 150q-10-80-150-90-60 0-70 30 0 70 190 90 30 0 30-30z" fill="url(#lg)" stroke="#fff3c4" stroke-width="3" opacity=".75"/></svg><div class="ft"><button data-m="Website">&#127760; Website</button><button data-m="Contact us">&#9993; Contact us</button></div></div>'}

function disp(){var s=S.sec,tabs='',side='',stage='',tech='',n=NAV[s=='blu'?0:1];
var tt=function(a){return '<div class="tt">'+a.map(function(x,i){return '<button class="'+(S.sub==i?'on':'')+'" data-set="sub:'+i+'">'+x+'</button>'}).join('')+'</div>'};
var im=function(k){return '<div class="sc"><img src="'+IM[k]+'" alt=""></div>'};
if(s=='blu'){var T=['Blumax','Blumax Ultra','Blumax Kontrast'],k=['b','u','k'][S.sub];tabs=tt(T);stage=im(k+(S.side==1?1:0));side=BT(['Standard Lens',T[S.sub]],'side')}
else{tabs=tt(['Bifocal','PAL']);
if(S.sub==0){stage=im('bf');side=BT(BIF.map(function(x){return x[0]}),'side')+'<p>'+BIF[S.side][1]+'</p>'}
else{var p=PAL[S.side];stage=im(p[2]);side=BT(PAL.map(function(x){return x[0]}),'side');
if(p[1])tech='<div class="tk" style="width:'+((ED[p[1]-1]-30)/630*3.8*TA).toFixed(2)+'rem"><img src="'+IM.tk+'" alt=""></div>'}}
return '<div style="display:flex;flex-direction:column;height:100%"><div class="top"><button data-back="1">&#10094; Menu</button><h2>'+n[2]+'</h2>'+GX+'</div><div class="pn">'+tabs+'<div class="bd"><div class="st">'+stage+'</div><div class="sd">'+side+'</div></div><div class="tkw">'+tech+'</div></div><div class="nav">'+NAV.map(function(x){return '<button class="'+(x[1]==s?'on':'')+'" data-go="'+x[1]+'">'+x[0]+'</button>'}).join('')+'</div></div>'}

$('#app').innerHTML=h}
